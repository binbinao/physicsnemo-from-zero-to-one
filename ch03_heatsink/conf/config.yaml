# Chapter 3: Heat Sink Configuration
hidden: 128
depth: 5
steps: 3000
lr: 0.001

# Geometry
fin_height: 20.0
n_fins: 3

# Physics
k: 1.0
Q: 0.0
T_source: 100.0
h_conv: 10.0
T_inf: 0.0
# Robin 量纲：物理特征长度 L0，与 k / h_conv 同为 SI 单位（30 mm → 0.03 m）。
# 网络输入坐标按 scale=30 归一化，robin_boundary 必须用 1/L0 把法向导数换回 SI。
# 0 = legacy（复现修复前数值）；不要写 30（那是坐标归一化常数，不是 L0）。
robin_scale: 0.03

# Sampling
n_interior: 3000
n_bottom: 300
n_side: 300
n_robin: 500
n_base_top: 200

# Loss weights
w_pde: 1.0
w_bottom: 10.0
w_side: 1.0
w_robin: 5.0
w_base_top: 5.0

# Network extensions (defaults keep the original tanh / no-Fourier behaviour)
activation: tanh
hard_bottom: false
fourier_maps: 0
fourier_scale: 6.0
seed: 0

output_dir: outputs
